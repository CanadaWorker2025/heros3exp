<LC_LobbyRules> = "Az alábbi szabályok szabályozzák a publikus cset szobákat és a nyilvános üzenetek létrehozását (beleértve a cset üzeneteket, játék leírásokat, beceneveket.). Nem szabályozzák a privát üzeneteket és a játékon belüli etikusságot.
A következõk szigorúan tilosak:
1. Obszcén szóhasználat, bántalmazás, fenyegetés vagy provokáció a többi játékos felé.
2. Olyan üzenet közzététele, aminek nincs jelentése vagy nincs köze a váróterem témájához. Túlzott üzenetküldés és túlzott formázás.
3. Idegen nyelv használata egyes csetelésben (angol nyelv használata megengedett minden csetelésben szükség esetén)
4. Reklámozás
5. Veszélyes linkek küldése és sértõ, provokatív vagy obszcén tartalmakra (pornográfia, traumatikus képek stb.) mutató linkek
6. Nyilvános ítélkezés és/vagy adminisztrátorok akadályozása

Ezen irányelvek megsértése esetén, az adminisztrátorok a következõ intézkedéseket hajthatja végre:
- Felhasználó meglévõ üzeneteinek vagy játék leírásának cenzúrázása
- Csak-olvasó státusz: a felhasználó nem tud többé üzenetet küldeni vagy játék leírást megváltoztatni
- Egyes felhasználók letiltása
- Teljes kitiltás a váróterembõl
Az adminisztrátoroknak joga van ezeket az intézkedéseket saját belátása szerint alkalmazni, hogy a váróteremben az egészséges légkört megtartsa."

